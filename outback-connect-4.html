<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outback Connect 4 🪃</title>
<style>
@font-face { font-family:'Bowlby One SC'; src:url('fonts/BowlbyOneSC-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; }
@font-face { font-family:'Quicksand'; src:url('fonts/Quicksand-Medium.ttf') format('truetype'); font-weight:500; font-display:swap; }
@font-face { font-family:'Quicksand'; src:url('fonts/Quicksand-Bold.ttf') format('truetype'); font-weight:700; font-display:swap; }

:root{
  --ink:#5A1E0E; --deep:#6E2211;
  --gold:#FFD23F; --white:#fff;
  --you:#F6A23A; --you-dk:#C2410C; --cpu:#FFC9A8; --cpu-dk:#C8391B;
  --disp:'Bowlby One SC','Arial Black',sans-serif; --body:'Quicksand','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html,body{margin:0; height:100%; font-family:var(--body); user-select:none; -webkit-user-select:none; overflow:hidden;
  background:
    radial-gradient(120% 60% at 50% 118%, #FFFFFF 0%, #FFF7EA 30%, transparent 64%),
    linear-gradient(180deg, #F6A23A 0%, #FFE6BD 46%, #FFF0D6 100%);}
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.aurora{position:absolute;left:-10%;right:-10%;top:-10%;height:60%;filter:blur(40px);opacity:0.5;
  background:radial-gradient(40% 30% at 22% 52%,rgba(255,160,60,.9),transparent 70%),radial-gradient(34% 26% at 55% 36%,rgba(255,160,60,.6),transparent 70%),radial-gradient(30% 22% at 82% 50%,rgba(255,200,140,.6),transparent 70%);
  animation:adrift 14s ease-in-out infinite alternate;}
@keyframes adrift{from{transform:translateX(-3%) skewX(-6deg)}to{transform:translateX(3%) skewX(6deg)}}
.floes{position:absolute;left:0;right:0;bottom:0;height:100px;
  background:radial-gradient(60px 34px at 6% 70%,#fff 98%,transparent 100%),radial-gradient(110px 50px at 20% 88%,#fff 98%,transparent 100%),radial-gradient(90px 40px at 38% 76%,#fff 98%,transparent 100%),radial-gradient(140px 56px at 58% 92%,#fff 98%,transparent 100%),radial-gradient(80px 38px at 76% 74%,#fff 98%,transparent 100%),radial-gradient(130px 52px at 94% 90%,#fff 98%,transparent 100%);
  filter:drop-shadow(0 -4px 0 rgba(90,30,14,.14));}
.snow i{position:absolute;top:-20px;border-radius:50%;background:#F6A23A;box-shadow:0 0 0 2px rgba(90,30,14,.12);animation:sfall linear infinite;}
@keyframes sfall{to{transform:translate(var(--dx,30px),110vh)}}
@media (prefers-reduced-motion: reduce){ .snow i,.aurora{animation:none;} }
button{font-family:inherit; cursor:pointer;}

#wrap{position:relative; z-index:2; height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px clamp(8px,2vw,30px) 18px;}

header{display:flex; align-items:center; gap:clamp(10px,2vw,22px); flex-wrap:wrap; justify-content:center; margin-bottom:8px;}
h1{font-family:var(--disp); color:var(--ink); font-size:clamp(22px,3.3vw,40px); margin:0; text-shadow:0 3px 0 #fff,0 5px 0 rgba(59,15,8,.25); line-height:1;}
h1 .em{color:#C8391B;}
#turn{display:flex; align-items:center; gap:11px; background:#fff; border:4px solid var(--ink); border-radius:999px; padding:8px 22px; box-shadow:0 5px 0 rgba(59,15,8,.28); transition:border-color .2s;}
#turn .dot{width:24px; height:24px; border-radius:50%; border:3px solid var(--ink); flex:none;}
#turn .who{font-family:var(--disp); font-size:clamp(15px,2vw,20px); color:var(--ink); line-height:1;}
#turn.you{border-color:var(--you-dk);} #turn.you .dot{background:var(--you);}
#turn.cpu{border-color:var(--cpu);} #turn.cpu .dot{background:var(--cpu);}
.btn{font-family:var(--disp); font-size:16px; color:var(--ink); background:var(--gold); border:4px solid var(--ink); border-radius:14px; padding:10px 22px; box-shadow:0 5px 0 var(--ink); transition:transform .1s, box-shadow .1s;}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--ink);}

#stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; width:100%;}
#frame{--cell:clamp(40px,9.4vh,86px); --gap:clamp(6px,1vh,12px);
  background:linear-gradient(160deg,#F6A23A,#5A1E0E); border:6px solid var(--ink); border-radius:22px; padding:calc(var(--gap)*1.4); box-shadow:0 12px 0 rgba(59,15,8,.3);}

#cols{display:grid; grid-template-columns:repeat(7,var(--cell)); gap:var(--gap); margin-bottom:var(--gap);}
.colbtn{height:calc(var(--cell)*0.62); border:4px solid var(--ink); border-radius:12px; background:#FFF7EA;
  font-family:var(--disp); font-size:calc(var(--cell)*0.42); color:var(--ink); display:grid; place-items:center; line-height:1;
  box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s, background .15s;}
.colbtn:hover:not(:disabled){background:#FFF2BF; transform:translateY(-2px); box-shadow:0 6px 0 var(--ink);}
.colbtn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink);}
.colbtn:disabled{background:#FFE2B8; color:#8A4A30; opacity:.6; cursor:not-allowed; box-shadow:0 4px 0 #8A4A30;}

#board{display:grid; grid-template-columns:repeat(7,var(--cell)); grid-auto-rows:var(--cell); gap:var(--gap);
  background:#6E2211; padding:var(--gap); border-radius:16px; border:4px solid #5A1E0E;}
.cell{width:var(--cell); height:var(--cell); border-radius:50%; background:#3B0F08;
  box-shadow:inset 0 4px 8px rgba(0,0,0,.4); position:relative; overflow:hidden;}
.disc{position:absolute; inset:7%; border-radius:50%; display:grid; place-items:center;
  border:3px solid rgba(0,0,0,.22); font-size:calc(var(--cell)*0.4);}
.disc.you{background:radial-gradient(circle at 34% 30%,#FFFFFF,var(--you) 55%,var(--you-dk)); border-color:var(--you-dk);}
.disc.cpu{background:radial-gradient(circle at 34% 30%,#FFFFFF,var(--cpu) 55%,var(--cpu-dk)); border-color:var(--cpu-dk);}
.disc.drop{animation:drop .5s cubic-bezier(.3,.1,.3,1);}
@keyframes drop{0%{transform:translateY(calc(-1*var(--d)))}68%{transform:translateY(0)}80%{transform:translateY(-9%)}90%{transform:translateY(0)}95%{transform:translateY(-3%)}100%{transform:translateY(0)}}
.disc.you::after{content:"🪃"; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.disc.cpu::after{content:"🦘"; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.cell.win .disc{animation:winp 0.7s ease-in-out infinite; box-shadow:0 0 0 4px var(--gold),0 0 18px 4px rgba(255,210,63,.9); z-index:2;}
@keyframes winp{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

#mascot{position:fixed; right:18px; bottom:120px; width:clamp(80px,10vw,140px); z-index:2; pointer-events:none;
  transform:rotate(-6deg); filter:drop-shadow(0 8px 12px rgba(59,15,8,.35)); animation:mbob 4s ease-in-out infinite;}
@keyframes mbob{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-10px)}}

#over{position:fixed; inset:0; z-index:50; display:none; place-items:center; background:rgba(59,15,8,.8); backdrop-filter:blur(3px);}
#over.show{display:grid; animation:fade .3s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:#fff; border:7px solid var(--ink); border-radius:30px; padding:clamp(26px,4vw,46px); text-align:center; box-shadow:0 16px 0 rgba(59,15,8,.34); max-width:90vw; animation:pop .45s cubic-bezier(.34,1.5,.5,1);}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.card .ico{width:clamp(110px,16vw,168px); height:clamp(110px,16vw,168px); margin:0 auto; display:none; animation:bob 1.5s ease-in-out infinite;}
.card .ico.show{display:block;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.card h2{font-family:var(--disp); font-size:clamp(32px,5vw,54px); margin:6px 0 18px; line-height:1;}
.card h2.you{color:var(--you-dk);} .card h2.cpu{color:var(--cpu-dk);} .card h2.draw{color:var(--ink);}

.conf{position:fixed; top:-20px; z-index:60; pointer-events:none; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.9;}}
.backlink{position:fixed; left:0; right:0; bottom:6px; text-align:center; z-index:3; font-weight:700; font-size:15px; color:var(--ink);}
.backlink a{color:#5A1E0E; text-decoration:none; border-bottom:3px dotted #5A1E0E;}
.cpu-fix{}:root{--cpu:#A8E0F2;--cpu-dk:#2B7FB8;}
.floes{background:radial-gradient(160px 60px at 8% 100%,#C8391B 98%,transparent 100%),radial-gradient(260px 80px at 30% 110%,#B02E12 98%,transparent 100%),radial-gradient(200px 64px at 55% 104%,#C8391B 98%,transparent 100%),radial-gradient(300px 90px at 82% 112%,#B02E12 98%,transparent 100%),radial-gradient(150px 56px at 100% 100%,#C8391B 98%,transparent 100%)!important;filter:none!important;}
.aurora{background:radial-gradient(40% 34% at 70% 60%,rgba(255,210,63,.8),transparent 70%),radial-gradient(36% 28% at 25% 45%,rgba(246,162,58,.7),transparent 70%)!important;}
.snow i{background:#E0782A!important;box-shadow:none!important;opacity:.45;}
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#F6A23A"></rect>
  <rect x="86" y="120" width="340" height="300" rx="26" fill="#F6A23A" stroke="#5A1E0E" stroke-width="14"></rect>
  <circle cx="170" cy="200" r="34" fill="#FFFFFF"></circle><circle cx="256" cy="200" r="34" fill="#FFC9A8"></circle>
  <circle cx="342" cy="200" r="34" fill="#3B0F08"></circle><circle cx="170" cy="290" r="34" fill="#FFC9A8"></circle>
  <circle cx="256" cy="290" r="34" fill="#FFFFFF"></circle><circle cx="342" cy="290" r="34" fill="#FFFFFF"></circle>
  <circle cx="170" cy="380" r="34" fill="#3B0F08"></circle><circle cx="256" cy="380" r="34" fill="#FFC9A8"></circle>
  <circle cx="342" cy="380" r="34" fill="#3B0F08"></circle>
</svg>
</template>

<div class="scene">
  <div class="aurora"></div>
  <div class="snow" id="snow"></div>
  <div class="floes"></div>
</div>

<div id="wrap">
  <header>
    <h1>OUTBACK <span class="em">CONNECT 4</span></h1>
    <div id="turn" class="you"><span class="dot"></span><span class="who">Your turn!</span></div>
    <button class="btn" id="newBtn">↺ New Game</button>
  </header>
  <div id="stage">
    <div id="frame">
      <div id="cols"></div>
      <div id="board"></div>
    </div>
  </div>
</div>

<img id="mascot" src="stickers/svg/detective-magnifier.svg" alt="Detective cat mascot with a magnifying glass">

<div id="over">
  <div class="card">
    <img class="ico" id="icoYou" src="stickers/svg/grade-a.svg" alt="Grade A cat sticker">
    <img class="ico" id="icoCpu" src="stickers/svg/question.svg" alt="Puzzled cat sticker">
    <img class="ico" id="icoDraw" src="stickers/svg/cat.svg" alt="Cat sticker">
    <h2 id="overMsg">You win!</h2>
    <button class="btn" id="againBtn">🪃 Play Again</button>
  </div>
</div>

<div class="backlink">🪃 <a href="lesson-30-aboriginal-australia.html">Back to Lesson 30</a></div>

<script>
(function(){
  "use strict";
  var COLS=7, ROWS=6, YOU=1, CPU=2;
  var grid, current, busy, gameOver;

  var colsEl=document.getElementById('cols'),
      boardEl=document.getElementById('board'),
      turnEl=document.getElementById('turn'),
      overEl=document.getElementById('over');

  var AC=null, soundOn=true;
  function ac(){ if(!AC){ try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} } return AC; }
  function tone(f,d,t,v){ if(!soundOn) return; var c=ac(); if(!c) return; var o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||.18,c.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d+.02); }
  function dropSound(){ tone(300,.12,'sine',.16); setTimeout(function(){tone(160,.1,'sine',.12);},90); }
  function winSound(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){tone(f,.28,'triangle',.22);}, i*110); }); }
  function loseSound(){ [392,330,262].forEach(function(f,i){ setTimeout(function(){tone(f,.3,'sawtooth',.16);}, i*140); }); }

  function emptyGrid(){ var g=[]; for(var c=0;c<COLS;c++){ g[c]=[]; for(var r=0;r<ROWS;r++) g[c][r]=0; } return g; }
  function lowestEmpty(g,c){ for(var r=ROWS-1;r>=0;r--) if(g[c][r]===0) return r; return -1; }
  function validCols(g){ var v=[]; for(var c=0;c<COLS;c++) if(g[c][0]===0) v.push(c); return v; }

  var DIRS=[[1,0],[0,1],[1,1],[1,-1]];
  function winningCells(g,player){
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){
      if(g[c][r]!==player) continue;
      for(var d=0;d<DIRS.length;d++){
        var dc=DIRS[d][0], dr=DIRS[d][1], cells=[[c,r]], ok=true;
        for(var k=1;k<4;k++){ var nc=c+dc*k, nr=r+dr*k;
          if(nc<0||nc>=COLS||nr<0||nr>=ROWS||g[nc][nr]!==player){ ok=false; break; } cells.push([nc,nr]); }
        if(ok) return cells;
      }
    }
    return null;
  }
  function isWin(g,p){ return !!winningCells(g,p); }

  function build(){
    grid=emptyGrid(); current=YOU; busy=false; gameOver=false;
    overEl.classList.remove('show');
    setTurn(YOU);
    colsEl.innerHTML=''; boardEl.innerHTML='';
    for(var c=0;c<COLS;c++){
      (function(col){
        var b=document.createElement('button'); b.className='colbtn'; b.dataset.col=col; b.textContent='▼';
        b.setAttribute('aria-label','Drop in column '+(col+1));
        b.addEventListener('click',function(){ playerMove(col); });
        colsEl.appendChild(b);
      })(c);
    }
    for(var r=0;r<ROWS;r++) for(var cc=0;cc<COLS;cc++){
      var cell=document.createElement('div'); cell.className='cell'; cell.dataset.c=cc; cell.dataset.r=r;
      boardEl.appendChild(cell);
    }
  }
  function cellEl(c,r){ return boardEl.querySelector('.cell[data-c="'+c+'"][data-r="'+r+'"]'); }

  function setTurn(p){
    turnEl.className = p===YOU?'you':'cpu';
    turnEl.querySelector('.who').textContent = p===YOU?'Your turn!':'The Husky is sniffing…';
  }
  function setColsEnabled(on){
    [].forEach.call(colsEl.children,function(b){
      var col=+b.dataset.col; b.disabled = !on || grid[col][0]!==0;
    });
  }

  function place(col, player, after){
    var r=lowestEmpty(grid,col); if(r<0) return;
    grid[col][r]=player;
    var cell=cellEl(col,r);
    var disc=document.createElement('div'); disc.className='disc '+(player===YOU?'you':'cpu')+' drop';
    var cellPx=cell.getBoundingClientRect().height; var gap=parseFloat(getComputedStyle(boardEl).gap)||10;
    disc.style.setProperty('--d', ((r+1)*(cellPx+gap))+'px');
    cell.appendChild(disc); dropSound();
    setTimeout(function(){ disc.classList.remove('drop'); if(after) after(r); },500);
  }

  function playerMove(col){
    if(busy||gameOver||grid[col][0]!==0||current!==YOU) return;
    ac(); busy=true; setColsEnabled(false);
    place(col,YOU,function(){
      if(checkEnd(YOU)) return;
      current=CPU; setTurn(CPU);
      setTimeout(cpuMove, 520);
    });
  }

  function cpuMove(){
    if(gameOver) return;
    var col=chooseCpu();
    place(col,CPU,function(){
      if(checkEnd(CPU)) return;
      current=YOU; setTurn(YOU); busy=false; setColsEnabled(true);
    });
  }

  function checkEnd(player){
    var cells=winningCells(grid,player);
    if(cells){ gameOver=true; busy=true; setColsEnabled(false);
      cells.forEach(function(p){ cellEl(p[0],p[1]).classList.add('win'); });
      setTimeout(function(){ showResult(player); }, 700);
      return true;
    }
    if(validCols(grid).length===0){ gameOver=true; setTimeout(function(){ showResult(0); },400); return true; }
    return false;
  }

  function copyGrid(g){ return g.map(function(col){ return col.slice(); }); }
  function tryDrop(g,col,p){ var r=lowestEmpty(g,col); if(r<0) return -1; g[col][r]=p; return r; }

  function chooseCpu(){
    var valid=validCols(grid);
    for(var i=0;i<valid.length;i++){ var g=copyGrid(grid); tryDrop(g,valid[i],CPU); if(isWin(g,CPU)) return valid[i]; }
    for(var j=0;j<valid.length;j++){ var g2=copyGrid(grid); tryDrop(g2,valid[j],YOU); if(isWin(g2,YOU)) return valid[j]; }
    var safe=[];
    for(var k=0;k<valid.length;k++){
      var col=valid[k]; var g3=copyGrid(grid); tryDrop(g3,col,CPU);
      var givesWin=false; var v2=validCols(g3);
      for(var m=0;m<v2.length;m++){ var g4=copyGrid(g3); tryDrop(g4,v2[m],YOU); if(isWin(g4,YOU)){ givesWin=true; break; } }
      if(!givesWin) safe.push(col);
    }
    var pool=safe.length?safe:valid;
    var weights=[1,2,4,6,4,2,1];
    var best=[], bestScore=-1e9;
    for(var n=0;n<pool.length;n++){
      var c=pool[n]; var gg=copyGrid(grid); tryDrop(gg,c,CPU);
      var s=weights[c];
      s += countLines(gg,CPU,3)*8 + countLines(gg,CPU,2)*1;
      s -= countLines(gg,YOU,3)*4;
      s += Math.random()*0.5;
      if(s>bestScore){ bestScore=s; best=[c]; } else if(s===bestScore){ best.push(c); }
    }
    return best[Math.floor(Math.random()*best.length)];
  }
  function countLines(g,p,len){
    var n=0;
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){
      for(var d=0;d<DIRS.length;d++){
        var dc=DIRS[d][0], dr=DIRS[d][1], cnt=0, ok=true;
        for(var k=0;k<4;k++){ var nc=c+dc*k, nr=r+dr*k;
          if(nc<0||nc>=COLS||nr<0||nr>=ROWS){ ok=false; break; }
          var v=g[nc][nr]; if(v===p) cnt++; else if(v!==0){ ok=false; break; } }
        if(ok && cnt===len) n++;
      }
    }
    return n;
  }

  function showResult(player){
    var msg=document.getElementById('overMsg');
    ['icoYou','icoCpu','icoDraw'].forEach(function(id){ document.getElementById(id).classList.remove('show'); });
    if(player===YOU){ document.getElementById('icoYou').classList.add('show'); msg.textContent='YOU WIN!'; msg.className='you'; winSound(); confetti(); }
    else if(player===CPU){ document.getElementById('icoCpu').classList.add('show'); msg.textContent='The Husky got there first!'; msg.className='cpu'; loseSound(); }
    else { document.getElementById('icoDraw').classList.add('show'); msg.textContent="It's a draw!"; msg.className='draw'; tone(440,.2,'sine',.15); }
    overEl.classList.add('show');
  }
  function confetti(){
    var cols=['#FFD23F','#F6A23A','#FFC9A8','#fff','#F6A23A','#C2410C'];
    for(var i=0;i<90;i++){ var d=document.createElement('div'); d.className='conf';
      var s=7+Math.random()*9; d.style.width=s+'px'; d.style.height=(s*0.5)+'px';
      d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.4+Math.random()*2)+'s'; d.style.animationDelay=(Math.random()*0.6)+'s';
      if(Math.random()<.5) d.style.borderRadius='50%';
      document.body.appendChild(d); (function(el){setTimeout(function(){el.remove();},5200);})(d);
    }
  }

  document.getElementById('newBtn').addEventListener('click',function(){ build(); setColsEnabled(true); });
  document.getElementById('againBtn').addEventListener('click',function(){ build(); setColsEnabled(true); });

  build(); setColsEnabled(true);
})();
</script>
<script>(function(){var b=document.getElementById('snow');for(var i=0;i<34;i++){var e=document.createElement('i'),s=5+Math.random()*12;e.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;opacity:'+(.45+Math.random()*.5)+';animation-duration:'+(9+Math.random()*11)+'s;animation-delay:-'+(Math.random()*20)+'s;--dx:'+(Math.random()*120-60)+'px';b.appendChild(e);}})();</script>
</body>
</html>
